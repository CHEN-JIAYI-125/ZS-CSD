# data path 
train_path: data/train_data.json
dev_path: data/dev_data.json
test_path: data/test_data.json

# bert
plm: roberta
bert_dir: ./plm/chinese-roberta-wwm-ext/

# parameter 
epoch_size: 20
batchsize: 16
patience: 10
max_grad_norm: 1.0
warmup_proportion: 0.1
gradient_accumulation_steps: 1
adam_epsilon: 1e-8
warmup_steps: 0

# topology — dual-channel context / speaker-history
use_topology: 1
speaker_history_k: 1
edge_time_decay: 0.3
topology_dropout: 0.2
topology_gate_init: -2.0
label_smoothing: 0.05
alpha: 0

# speaker hypergraph (v2)
use_speaker_hypergraph: 1
speaker_hypergraph_k: 4
speaker_hypergraph_min_size: 2
hypergraph_dropout: 0.2
hypergraph_gate_init: -3.0
