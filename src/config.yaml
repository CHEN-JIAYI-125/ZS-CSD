# data path 
train_path: data/train_data.json
dev_path: data/dev_data.json
test_path: data/test_data.json

# bert
plm: roberta
bert_dir: ./plm/chinese-roberta-wwm-ext/

# parameter 
epoch_size: 20
batchsize: 16
patience: 0  # 0 = disable early stopping; >0 stops after N epochs without dev F1 gain
max_grad_norm: 1.0
warmup_proportion: 0.1
gradient_accumulation_steps: 1
adam_epsilon: 1e-8
warmup_steps: 0

# topology — context graph + optional GLAN heterograph (speaker hypergraph lives in SSE)
use_topology: 1
use_glan_topology: 0
topology_local_window: 3
glan_dropout: 0.1
glan_branches: global,local,struct,final
speaker_history_k: 1
edge_time_decay: 0.3
topology_dropout: 0.2
sse_dropout: 0.2
label_smoothing: 0.05
alpha: 0  # target_CL removed from model_3; kept for v0-v2 compatibility

# episode hypergraph (v2): reply-chain + interaction events
use_speaker_hypergraph: 1
use_reply_chain_hyperedge: 1
use_interaction_hyperedge: 1
reply_hypergraph_depth: 2
reply_hypergraph_min_size: 2
interaction_hypergraph_min_size: 2
episode_attention_dim: 128
episode_hypergraph_dropout: 0.3
episode_gate_init: -2.0
episode_gate_max: 0.15
hypergraph_time_decay_init: -2.5
hypergraph_lr: 1.0e-5
weight_decay: 1.0e-4

# staged fine-tuning (only active when staged_training: 1)
staged_training: 0
stage_a_epochs: 2  # hypergraph only
stage_b_epochs: 3  # hypergraph + topology + head
bert_lr_stage_c: 1.0e-6
other_lr_stage_b: 2.0e-6
other_lr_stage_c: 1.0e-6
hypergraph_lr_stage_c: 5.0e-6

# v3 — target knowledge (offline JSON, no web search at train time)
use_target_knowledge: 1
require_target_knowledge: 0
target_knowledge_path: data/target_knowledge_template.json
target_knowledge_max_chars: 64
knowledge_stance_only: 0  # load description as neutral side for stance attention
use_knowledge_stance_attention: 1  # attend h_sem to favor/against/neutral, concat to classifier
knowledge_dropout: 0.1

# v4 — all_label posterior teacher + distilled student (train-only labels)
use_posterior_knowledge: 1
posterior_distill_weight: 0.5
posterior_aux_ce_weight: 0.2
posterior_dropout: 0.1
posterior_side_dim: 64
posterior_temperature: 1.0
max_seq_length: 256
max_knowledge_seq_length: 48
